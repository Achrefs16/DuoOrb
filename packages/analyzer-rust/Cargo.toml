[package]
name = "duoorb-analyzer"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.14", default-features = false, features = ["napi8", "async", "serde-json"] }
napi-derive = "2.16.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.10"

[build-dependencies]
napi-build = "2.1.4"
