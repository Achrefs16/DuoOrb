    <script>
      // 1. Mouse-wheel horizontal scrolling for horizontal scroll views on Web
      window.addEventListener('wheel', function(e) {
        var target = e.target;
        while (target && target !== document.body) {
          var style = window.getComputedStyle(target);
          var isHorizontal = (style.overflowX === 'auto' || style.overflowX === 'scroll');
          if (isHorizontal && target.scrollWidth > target.clientWidth) {
            var rawDelta = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
            var multiplier = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? target.clientWidth : 1;
            var delta = rawDelta * multiplier;
            if (Math.abs(delta) < 40 && delta !== 0) {
              delta = Math.sign(delta) * 60;
            }
            var canScrollLeft = target.scrollLeft > 0 && delta < 0;
            var canScrollRight = target.scrollLeft < (target.scrollWidth - target.clientWidth - 1) && delta > 0;
            if (canScrollLeft || canScrollRight) {
              e.preventDefault();
              target.scrollLeft += delta;
              return;
            }
          }
          target = target.parentElement;
        }
      }, { passive: false });

      // 2. Click-and-drag mouse scrolling for horizontal scroll views on Web
      (function() {
        var isDown = false;
        var startX = 0;
        var scrollLeft = 0;
        var activeContainer = null;
        var hasDragged = false;

        window.addEventListener('mousedown', function(e) {
          if (e.button !== 0) return;
          var target = e.target;
          while (target && target !== document.body) {
            var style = window.getComputedStyle(target);
            if ((style.overflowX === 'auto' || style.overflowX === 'scroll') && target.scrollWidth > target.clientWidth) {
              isDown = true;
              hasDragged = false;
              activeContainer = target;
              startX = e.pageX - target.offsetLeft;
              scrollLeft = target.scrollLeft;
              return;
            }
            target = target.parentElement;
          }
        });

        window.addEventListener('mouseleave', function() {
          isDown = false;
          activeContainer = null;
        });

        window.addEventListener('mouseup', function() {
          isDown = false;
          activeContainer = null;
        });

        window.addEventListener('mousemove', function(e) {
          if (!isDown || !activeContainer) return;
          var x = e.pageX - activeContainer.offsetLeft;
          var walk = (x - startX);
          if (Math.abs(walk) > 5) {
            hasDragged = true;
            e.preventDefault();
            activeContainer.scrollLeft = scrollLeft - walk;
          }
        });

        // Prevent click if user was dragging
        window.addEventListener('click', function(e) {
          if (hasDragged) {
            e.stopPropagation();
            e.preventDefault();
            hasDragged = false;
          }
        }, true);
      })();
    </script>
