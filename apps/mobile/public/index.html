<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style id="duoorb-fonts">
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_400Regular.ttf') format('truetype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_500Medium.ttf') format('truetype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_600SemiBold.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_700Bold.ttf') format('truetype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope';
        src: url('/fonts/Manrope_800ExtraBold.ttf') format('truetype');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }

      /* Direct aliases for React Native font family tokens on Web */
      @font-face {
        font-family: 'Manrope_400Regular';
        src: url('/fonts/Manrope_400Regular.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope_500Medium';
        src: url('/fonts/Manrope_500Medium.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope_600SemiBold';
        src: url('/fonts/Manrope_600SemiBold.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope_700Bold';
        src: url('/fonts/Manrope_700Bold.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Manrope_800ExtraBold';
        src: url('/fonts/Manrope_800ExtraBold.ttf') format('truetype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      /* Tajarib Arabic Font Family */
      @font-face {
        font-family: 'Tajarib';
        src: url('/fonts/Tajarib-Light.otf') format('opentype');
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajarib';
        src: url('/fonts/Tajarib-Regular.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajarib';
        src: url('/fonts/Tajarib-Medium.otf') format('opentype');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajarib';
        src: url('/fonts/Tajarib-Bold.otf') format('opentype');
        font-weight: 600 700;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajarib';
        src: url('/fonts/Tajarib-Black.otf') format('opentype');
        font-weight: 800 900;
        font-style: normal;
        font-display: swap;
      }

      /* Direct aliases for React Native font family tokens on Web */
      @font-face {
        font-family: 'Tajarib-Light';
        src: url('/fonts/Tajarib-Light.otf') format('opentype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajarib-Regular';
        src: url('/fonts/Tajarib-Regular.otf') format('opentype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajarib-Medium';
        src: url('/fonts/Tajarib-Medium.otf') format('opentype');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Tajarib-Bold';
        src: url('/fonts/Tajarib-Bold.otf') format('opentype');

        font-display: swap;
      }
      @font-face {

        font-display: swap;
      }
    </style>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      html[lang="ar"],
      html[dir="rtl"],
      html[lang="ar"] body,
      html[dir="rtl"] body {
        font-family: 'Tajarib', 'Tajarib-Regular', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
